name: Build VX EDITION APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Conferir arquivo do projeto
        shell: bash
        run: |
          test -s VX_EDITION_Projeto_GitHub_Actions_REVISADO.zip
          unzip -t VX_EDITION_Projeto_GitHub_Actions_REVISADO.zip
          unzip -o VX_EDITION_Projeto_GitHub_Actions_REVISADO.zip -d .
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK sem aceitar licenças automaticamente
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Aceitar licenças Android
        shell: bash
        run: |
          for i in {1..30}; do echo y; done | sdkmanager --licenses

      - name: Instalar Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-provider: basic

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Conferir APK gerado
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Salvar APK
        uses: actions/upload-artifact@v7
        with:
          name: VX-EDITION-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
